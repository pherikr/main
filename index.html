<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Penalty Shot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; }
canvas { display:block; }
#ui {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none;
}
#msg {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  color:#fff; font:bold 17px Arial; text-align:center;
  background:rgba(0,0,0,0.55); padding:7px 18px; border-radius:20px;
  white-space:nowrap; pointer-events:none;
}
/* Power bar */
#powerWrap {
  display:none; position:absolute; bottom:90px; left:50%; transform:translateX(-50%);
  flex-direction:column; align-items:center; gap:6px;
}
#powerLabel { color:#fff; font:bold 14px Arial; }
#powerBg {
  width:220px; height:26px; background:rgba(0,0,0,0.6);
  border:2px solid #fff; border-radius:13px; overflow:hidden;
}
#powerFill {
  height:100%; width:0%; border-radius:11px;
  background:linear-gradient(90deg,#00cc44,#ffcc00,#ff3300);
}
#powerPct { color:#fff; font:13px Arial; }
#holdBtn {
  display:none; position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  pointer-events:auto; cursor:pointer;
  background:linear-gradient(135deg,#1a6ed8,#0d4aab);
  color:#fff; font:bold 20px Arial; border:3px solid #fff;
  border-radius:50px; padding:15px 42px;
  user-select:none; -webkit-user-select:none;
}
/* Spin */
#spinWrap {
  display:none; position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  flex-direction:column; align-items:center; gap:10px;
}
#spinLabel { color:#fff; font:bold 14px Arial; }
#spinCanvas { border:3px solid rgba(255,255,255,0.8); border-radius:50%; cursor:crosshair; pointer-events:auto; }
#shootBtn {
  pointer-events:auto; cursor:pointer;
  background:linear-gradient(135deg,#cc1111,#881111);
  color:#fff; font:bold 22px Arial; border:3px solid #fff;
  border-radius:50px; padding:13px 48px;
  user-select:none; -webkit-user-select:none;
}
/* Result */
#result {
  display:none; position:absolute; top:0; left:0; width:100%; height:100%;
  align-items:center; justify-content:center; flex-direction:column;
  background:rgba(0,0,0,0.45); pointer-events:auto; cursor:pointer;
}
#resultTxt {
  font:900 80px "Arial Black",Arial;
  text-shadow:4px 4px 0 #000,-2px -2px 0 #000;
  animation:pulse 0.5s ease-in-out infinite alternate;
}
#resultSub { color:#fff; font:20px Arial; margin-top:10px; text-shadow:2px 2px 4px #000; }
@keyframes pulse { from{transform:scale(1)} to{transform:scale(1.09)} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="msg">Drag from the ball toward the goal to aim</div>
</div>
<div id="powerWrap" style="display:none;position:absolute;bottom:90px;left:50%;transform:translateX(-50%);flex-direction:column;align-items:center;gap:6px;">
  <div id="powerLabel">POWER</div>
  <div id="powerBg"><div id="powerFill"></div></div>
  <div id="powerPct">0%</div>
</div>
<button id="holdBtn">HOLD FOR POWER</button>
<div id="spinWrap" style="display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);flex-direction:column;align-items:center;gap:10px;">
  <div id="spinLabel">TAP FOR SPIN</div>
  <canvas id="spinCanvas" width="120" height="120"></canvas>
  <button id="shootBtn">⚽ SHOOT</button>
</div>
<div id="result">
  <div id="resultTxt"></div>
  <div id="resultSub">Tap anywhere to retry</div>
</div>

<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const C = document.getElementById('c');
const cx = C.getContext('2d');
const SC = document.getElementById('spinCanvas');
const scx = SC.getContext('2d');
let W, H;
function resize(){
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Scene geometry ────────────────────────────────────────────────────────────
// All derived from W/H so it's responsive.
function S(){
  // Vanishing point = optical centre of goal mouth (ground level)
  const vpx = W * 0.5;
  const vpy = H * 0.40;

  // Goal on screen
  const gW  = W * 0.38;          // goal screen width
  const gH  = H * 0.17;          // goal screen height
  const gl  = vpx - gW/2;        // left post x
  const gr  = vpx + gW/2;        // right post x
  const gb  = vpy;               // crossbar is ABOVE vpy, ground IS vpy for goal face
  const gt  = vpy - gH;          // crossbar y (screen)

  // Ball resting position
  const bx  = W * 0.5;
  const by  = H * 0.84;
  const br  = Math.min(W,H) * 0.030;

  // px per real-world meter AT the goal line
  const pxmX = gW / 7.32;       // 7.32m real goal width
  const pxmY = gH / 2.44;       // 2.44m real goal height

  return {vpx,vpy,gW,gH,gl,gr,gb,gt,bx,by,br,pxmX,pxmY};
}

// ─── Project 3D world point to screen ─────────────────────────────────────────
// World: x=right, y=up, z=forward (ball at z=0, goal at z=11)
// At z=0 the "ground" is at screen y=by and world x=0 is screen x=bx
// At z=PDIST the goal frame sits at the goal screen coords
const PDIST = 11;

function proj(wx, wy, wz){
  const sc = S();
  if(wz < 0) wz = 0;
  const t = wz / PDIST; // 0 at ball, 1 at goal

  // Ground-level screen point at this depth (linear perspective)
  const gsx = sc.bx + (sc.vpx - sc.bx) * t;  // converges to vpx
  const gsy = sc.by + (sc.gb  - sc.by) * t;   // converges to gb

  // Pixel-per-meter scale grows with depth (perspective foreshortening)
  const scaleX = sc.pxmX * t;
  const scaleY = sc.pxmY * t;

  // Near-camera: boost scale so ball looks proper size at z≈0
  // Blend to a minimum scale at t=0 so ball isn't invisible
  const minScale = sc.br / 0.11; // 1 = 0.11m radius ball → sc.br pixels
  const effScaleX = Math.max(scaleX, minScale * 0.5);
  const effScaleY = Math.max(scaleY, minScale * 0.5);

  const sx = gsx + wx * effScaleX;
  const sy = gsy - wy * effScaleY; // up = negative screen y

  // Ball radius shrinks with depth
  const r = sc.br * (1 - t * 0.80);

  return { sx, sy, r: Math.max(r, 3) };
}

// ─── Game state ───────────────────────────────────────────────────────────────
let phase = 'aim'; // aim | power | spin | flight | result

// Aim
let dragging = false, dragSx, dragSy, curSx, curSy;
let aimTX = 0, aimTY = 0.5; // target in goal: x ∈ [-1,1], y ∈ [0,1]

// Power
let power = 0, powerDir = 1, powerIv = null, holding = false;

// Spin  (0.5,0.5 = no spin; x>0.5 = right curl; y<0.5 = topspin)
let spinX = 0.5, spinY = 0.5, spinChosen = false;

// Ball flight
let ball = null;  // {x,y,z, vx,vy,vz, wx,wy,wz}
let trail = [];
let keepDir = 0;   // -1 left, 0, +1 right
let keepProg = 0;  // 0→1 over flight
let flightLen = 0; // expected flight time in sim steps
let stepCount = 0;
let outcome = null; // 'goal'|'saved'|'miss'
let rot = 0;

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function drawSky(){
  const g = cx.createLinearGradient(0,0,0,H*0.52);
  g.addColorStop(0,'#080818'); g.addColorStop(1,'#1b3a6e');
  cx.fillStyle=g; cx.fillRect(0,0,W,H*0.52);
  // stars
  cx.fillStyle='rgba(255,255,255,0.7)';
  for(const [fx,fy] of [[.08,.06],[.19,.13],[.31,.04],[.44,.09],[.57,.03],[.68,.14],[.77,.07],[.87,.11],[.94,.05],[.13,.2],[.5,.17],[.73,.21]]){
    cx.beginPath(); cx.arc(fx*W, fy*H, 1.2,0,Math.PI*2); cx.fill();
  }
}

function drawPitch(){
  const sc=S();
  const g=cx.createLinearGradient(0,H*0.5,0,H);
  g.addColorStop(0,'#1a5c1a'); g.addColorStop(0.6,'#1e6b1e'); g.addColorStop(1,'#12401a');
  cx.fillStyle=g; cx.fillRect(0,H*0.5,W,H);

  // pitch lines from bottom corners to vanishing point
  cx.strokeStyle='rgba(255,255,255,0.10)'; cx.lineWidth=1;
  for(let i=0;i<=10;i++){
    const bx2=(i/10)*W;
    cx.beginPath(); cx.moveTo(bx2,H); cx.lineTo(sc.vpx,sc.vpy); cx.stroke();
  }

  // alternating mow stripes
  for(let s=0;s<8;s++){
    const t1=s/8, t2=(s+1)/8;
    const y1=sc.vpy+(H-sc.vpy)*t1, y2=sc.vpy+(H-sc.vpy)*t2;
    if(s%2===0){ cx.fillStyle='rgba(0,0,0,0.06)'; cx.fillRect(0,y1,W,y2-y1); }
  }

  // penalty spot
  cx.strokeStyle='rgba(255,255,255,0.3)'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(W*0.5,H*0.83,5,0,Math.PI*2); cx.stroke();
}

function drawGoal(){
  const sc=S();
  const {gl,gr,gt,gb}=sc;

  // net shadow
  cx.fillStyle='rgba(0,0,0,0.3)';
  cx.fillRect(gl,gt,gr-gl,gb-gt);

  // net grid
  cx.strokeStyle='rgba(255,255,255,0.15)'; cx.lineWidth=0.7;
  const nc=10, nr=6;
  for(let i=0;i<=nc;i++){
    const gx2=gl+(gr-gl)*i/nc;
    cx.beginPath(); cx.moveTo(gx2,gt); cx.lineTo(gx2,gb); cx.stroke();
  }
  for(let j=0;j<=nr;j++){
    const gy2=gt+(gb-gt)*j/nr;
    cx.beginPath(); cx.moveTo(gl,gy2); cx.lineTo(gr,gy2); cx.stroke();
  }

  // posts
  cx.fillStyle='#fff';
  cx.shadowColor='rgba(255,255,255,0.6)'; cx.shadowBlur=10;
  const pw=5;
  cx.fillRect(gl-pw/2, gt-pw/2, pw, gb-gt+pw);  // left
  cx.fillRect(gr-pw/2, gt-pw/2, pw, gb-gt+pw);  // right
  cx.fillRect(gl-pw/2, gt-pw/2, gr-gl+pw, pw);  // crossbar
  cx.shadowBlur=0;
}

function drawKeeper(){
  const sc=S();
  const {gl,gr,gt,gb}=sc;
  const kh=gb-gt;           // keeper height on screen
  const kw=kh*0.35;         // half-width
  const kcx=(gl+gr)/2;      // centre x
  const kcy=gb;             // feet at ground

  // Dive offset
  const maxDive=(gr-gl)*0.44;
  const diveX=keepDir*maxDive*keepProg;
  const diveAngle=keepDir*(Math.PI*0.4)*keepProg;
  const floatY=-kh*0.18*Math.sin(keepProg*Math.PI);

  cx.save();
  cx.translate(kcx+diveX, kcy+floatY);
  cx.rotate(diveAngle);

  const ks=kh;  // scale

  // legs
  cx.strokeStyle='#1a2e8c'; cx.lineWidth=ks*0.09; cx.lineCap='round';
  if(keepProg>0.05){
    cx.beginPath(); cx.moveTo(-ks*0.05,0); cx.lineTo(ks*0.28,-ks*0.42); cx.stroke();
    cx.beginPath(); cx.moveTo(ks*0.05,0);  cx.lineTo(-ks*0.28,-ks*0.42); cx.stroke();
  } else {
    cx.beginPath(); cx.moveTo(-ks*0.09,0); cx.lineTo(-ks*0.1,-ks*0.48); cx.stroke();
    cx.beginPath(); cx.moveTo(ks*0.09,0);  cx.lineTo(ks*0.1,-ks*0.48); cx.stroke();
  }

  // torso
  cx.fillStyle='#e8a020';
  cx.beginPath();
  cx.roundRect(-ks*0.13,-ks*0.9, ks*0.26,ks*0.42, ks*0.05);
  cx.fill();

  // number on jersey
  cx.fillStyle='rgba(255,255,255,0.7)'; cx.font=`bold ${ks*0.18}px Arial`;
  cx.textAlign='center'; cx.fillText('1',-0,-ks*0.73);

  // arms
  cx.strokeStyle='#e8a020'; cx.lineWidth=ks*0.085; cx.lineCap='round';
  if(keepProg>0.1){
    const ext=Math.min(keepProg*2,1);
    cx.beginPath(); cx.moveTo(-ks*0.13,-ks*0.82); cx.lineTo(-ks*(0.13+0.42*ext),-ks*(0.82-0.3*ext)); cx.stroke();
    cx.beginPath(); cx.moveTo(ks*0.13,-ks*0.82);  cx.lineTo(ks*(0.13+0.42*ext),-ks*(0.82-0.3*ext)); cx.stroke();
    // gloves
    cx.fillStyle='#ffee44';
    cx.beginPath(); cx.arc(-ks*(0.13+0.42*ext),-ks*(0.82-0.3*ext),ks*0.075,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(ks*(0.13+0.42*ext),-ks*(0.82-0.3*ext),ks*0.075,0,Math.PI*2); cx.fill();
  } else {
    cx.beginPath(); cx.moveTo(-ks*0.13,-ks*0.82); cx.lineTo(-ks*0.28,-ks*0.62); cx.stroke();
    cx.beginPath(); cx.moveTo(ks*0.13,-ks*0.82);  cx.lineTo(ks*0.28,-ks*0.62); cx.stroke();
    cx.fillStyle='#ffee44';
    cx.beginPath(); cx.arc(-ks*0.28,-ks*0.62,ks*0.065,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(ks*0.28,-ks*0.62,ks*0.065,0,Math.PI*2); cx.fill();
  }

  // head
  cx.fillStyle='#f5c8a0';
  cx.beginPath(); cx.arc(0,-ks*1.06,ks*0.155,0,Math.PI*2); cx.fill();
  cx.fillStyle='#3a1800';
  cx.beginPath(); cx.arc(0,-ks*1.13,ks*0.13,Math.PI,Math.PI*2); cx.fill();
  cx.fillStyle='#111';
  cx.beginPath(); cx.arc(-ks*0.055,-ks*1.05,ks*0.025,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(ks*0.055,-ks*1.05,ks*0.025,0,Math.PI*2); cx.fill();

  cx.restore();
}

function drawBall(sx, sy, r, rotation){
  cx.save();
  cx.translate(sx, sy);
  if(rotation) cx.rotate(rotation);

  // shadow on ground
  cx.fillStyle='rgba(0,0,0,0.25)';
  cx.beginPath(); cx.ellipse(0,r*0.45,r*0.75,r*0.18,0,0,Math.PI*2); cx.fill();

  // ball body
  const bg=cx.createRadialGradient(-r*0.3,-r*0.35,r*0.08,0,0,r);
  bg.addColorStop(0,'#fff'); bg.addColorStop(0.45,'#eee'); bg.addColorStop(1,'#bbb');
  cx.fillStyle=bg;
  cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fill();

  // patches
  cx.fillStyle='#111';
  for(const [px,py] of [[0,0],[0,-r*.52],[r*.5,-r*.24],[r*.5,r*.26],[-r*.5,r*.26],[-r*.5,-r*.24]]){
    cx.beginPath(); cx.arc(px,py,r*0.20,0,Math.PI*2); cx.fill();
  }

  // shine
  cx.fillStyle='rgba(255,255,255,0.55)';
  cx.beginPath(); cx.ellipse(-r*0.28,-r*0.32,r*0.17,r*0.09,-0.6,0,Math.PI*2); cx.fill();

  cx.restore();
}

// ─── Aim drawing ──────────────────────────────────────────────────────────────
function drawAim(){
  if(!dragging && phase==='aim') return;
  const sc=S();
  if(!dragging) return;

  // dotted line from ball to current pointer
  cx.save();
  cx.strokeStyle='rgba(255,220,0,0.88)'; cx.lineWidth=2.5;
  cx.setLineDash([9,6]); cx.lineDashOffset=-(Date.now()/40%15);
  cx.beginPath(); cx.moveTo(sc.bx,sc.by); cx.lineTo(curSx,curSy); cx.stroke();
  cx.setLineDash([]);

  // arrowhead at pointer
  const ang=Math.atan2(curSy-sc.by, curSx-sc.bx);
  cx.translate(curSx,curSy); cx.rotate(ang);
  cx.fillStyle='rgba(255,220,0,0.9)';
  cx.beginPath(); cx.moveTo(0,0); cx.lineTo(-13,-6); cx.lineTo(-13,6); cx.closePath(); cx.fill();
  cx.restore();

  // reticle in goal showing where ball will go
  const {gl,gr,gt,gb}=sc;
  const rx=gl+(aimTX+1)*0.5*(gr-gl);
  const ry=gt+(1-aimTY)*(gb-gt);
  cx.save();
  cx.strokeStyle='rgba(255,60,60,0.92)'; cx.lineWidth=2;
  const rs=14;
  cx.beginPath(); cx.moveTo(rx-rs,ry); cx.lineTo(rx+rs,ry); cx.stroke();
  cx.beginPath(); cx.moveTo(rx,ry-rs); cx.lineTo(rx,ry+rs); cx.stroke();
  cx.beginPath(); cx.arc(rx,ry,rs*0.55,0,Math.PI*2); cx.stroke();
  cx.restore();
}

// ─── Spin canvas ──────────────────────────────────────────────────────────────
function drawSpinCanvas(){
  const sw=SC.width, sh=SC.height;
  const cx2=scx;
  const ccx=sw/2, ccy=sh/2, r=sw*0.45;

  cx2.clearRect(0,0,sw,sh);

  // ball
  const g=cx2.createRadialGradient(ccx-r*.3,ccy-r*.3,r*.08,ccx,ccy,r);
  g.addColorStop(0,'#fff'); g.addColorStop(.5,'#eee'); g.addColorStop(1,'#aaa');
  cx2.fillStyle=g;
  cx2.beginPath(); cx2.arc(ccx,ccy,r,0,Math.PI*2); cx2.fill();

  cx2.fillStyle='#222';
  for(const [px,py] of [[ccx,ccy],[ccx,ccy-r*.44],[ccx+r*.4,ccy-r*.2],[ccx+r*.4,ccy+r*.2],[ccx-r*.4,ccy+r*.2],[ccx-r*.4,ccy-r*.2]])
  { cx2.beginPath(); cx2.arc(px,py,r*0.18,0,Math.PI*2); cx2.fill(); }

  // crosshair guide
  cx2.strokeStyle='rgba(0,130,255,0.3)'; cx2.lineWidth=1;
  cx2.beginPath(); cx2.moveTo(ccx,ccy-r); cx2.lineTo(ccx,ccy+r); cx2.stroke();
  cx2.beginPath(); cx2.moveTo(ccx-r,ccy); cx2.lineTo(ccx+r,ccy); cx2.stroke();

  // labels
  cx2.fillStyle='rgba(30,140,255,0.9)';
  cx2.font=`bold ${sw*0.09}px Arial`; cx2.textAlign='center';
  cx2.fillText('TOP',ccx,ccy-r*0.58);
  cx2.fillText('BOT',ccx,ccy+r*0.72);
  cx2.textAlign='right'; cx2.fillText('L',ccx-r*0.58,ccy+r*0.06);
  cx2.textAlign='left';  cx2.fillText('R',ccx+r*0.58,ccy+r*0.06);

  // chosen dot
  if(spinChosen){
    const dx=ccx+(spinX-0.5)*2*r*0.82;
    const dy=ccy+(spinY-0.5)*2*r*0.82;
    cx2.fillStyle='rgba(255,40,40,0.95)';
    cx2.beginPath(); cx2.arc(dx,dy,7,0,Math.PI*2); cx2.fill();
    cx2.strokeStyle='#fff'; cx2.lineWidth=2; cx2.stroke();
  }
}

// ─── Physics ──────────────────────────────────────────────────────────────────
const GRAV   = -9.81;
const DRAG_K = 0.006;
const MAG_K  = 0.10;
const DT     = 0.016;

function initFlight(){
  const spd = 12 + power * 0.28;   // 12–40 m/s based on power

  // Where we're aiming in world-metres at the goal line
  const tgX = aimTX * 3.0;            // ±3m (within ±3.66m post)
  const tgY = 0.3 + aimTY * 1.9;      // 0.3m (low) to 2.2m (high)

  // Time to cross the pitch at this speed
  const ft = PDIST / spd;

  // vz is just speed (no backward lean)
  const vz = spd;

  // vx chosen so we arrive at tgX
  const vx = tgX / ft;

  // vy so ball arrives at tgY given gravity
  // tgY = vy*ft + 0.5*GRAV*ft²  (starting at y≈0)
  const vy = (tgY - 0.5 * GRAV * ft * ft) / ft;

  // Spin → angular velocity
  // spinX: 0=hard left curl, 0.5=no curl, 1=hard right curl
  // spinY: 0=topspin, 0.5=none, 1=backspin
  const curlAmt  = (spinX - 0.5) * 2;     // -1..1
  const spinAmt  = (0.5 - spinY) * 2;     // -1..1 (+1 = topspin)

  ball = {
    x:0, y:0, z:0,
    vx, vy, vz,
    wx: spinAmt * 10,   // topspin axis (around x)
    wy: -curlAmt * 10,  // curl axis (around y)
    wz: 0,
  };

  // Expected flight steps
  flightLen = Math.round(ft / DT);
  stepCount = 0;
  trail = [];

  // Keeper dives toward aimed side (gently biased)
  const rand = Math.random();
  if(Math.abs(aimTX) < 0.25){
    // aimed centre: random dive
    keepDir = rand < 0.5 ? -1 : 1;
  } else {
    // dive toward the aimed side most of the time, miss 28% of time
    const aimed = aimTX > 0 ? 1 : -1;
    keepDir = rand < 0.28 ? -aimed : aimed;
  }
  keepProg = 0;
}

function stepPhysics(){
  if(!ball) return;
  const b = ball;

  const spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy + b.vz*b.vz);
  const drag = DRAG_K * spd;

  // Magnus: ω × v
  const Fx = MAG_K * (b.wy*b.vz - b.wz*b.vy);
  const Fy = MAG_K * (b.wz*b.vx - b.wx*b.vz);
  const Fz = MAG_K * (b.wx*b.vy - b.wy*b.vx);

  b.vx += (-drag*b.vx + Fx) * DT;
  b.vy += (GRAV + (-drag*b.vy + Fy)) * DT;
  b.vz += (-drag*b.vz + Fz) * DT;

  b.x += b.vx * DT;
  b.y += b.vy * DT;
  b.z += b.vz * DT;

  stepCount++;
  // Keeper progress: ramps from 0→1 over expected flight
  keepProg = Math.min(stepCount / flightLen, 1);

  trail.push({x:b.x, y:b.y, z:b.z});
  if(trail.length > 28) trail.shift();

  // Hit ground
  if(b.y < 0 && b.z < PDIST){
    b.y = 0;
    if(!outcome){ outcome='miss'; scheduleResult(); }
    return;
  }

  // Reached goal line
  if(b.z >= PDIST){
    evaluateShot(b.x, b.y);
  }
}

function evaluateShot(fx, fy){
  // Post half-width 3.66, crossbar 2.44
  const inGoal = Math.abs(fx) < 3.66 && fy > 0.05 && fy < 2.44;

  if(!inGoal){
    outcome = 'miss';
  } else {
    // Keeper final world-x position
    const keepMaxX = 3.0 * keepDir;   // max dive = 3m to that side
    const keepCX   = keepMaxX * keepProg; // where keeper ended up
    const keepCY   = 1.15;            // keeper body centre height

    // Keeper reach radius (metres)
    const reach = 1.05;
    const inHands = Math.abs(fx - keepCX) < reach && Math.abs(fy - keepCY) < reach * 1.3;
    outcome = inHands ? 'saved' : 'goal';
  }

  ball = null;
  scheduleResult();
}

function scheduleResult(){
  setTimeout(showResult, 700);
}

function showResult(){
  const el = document.getElementById('result');
  const txt = document.getElementById('resultTxt');
  el.style.display = 'flex';
  if(outcome==='goal'){ txt.textContent='GOAL!'; txt.style.color='#00ff55'; }
  else if(outcome==='saved'){ txt.textContent='SAVED!'; txt.style.color='#ff8800'; }
  else { txt.textContent='MISS!'; txt.style.color='#ff2222'; }
  phase='result';
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastStep = 0;
function loop(ts){
  if(phase==='flight'){
    if(ts - lastStep >= 16){
      stepPhysics();
      lastStep = ts;
    }
  }

  cx.clearRect(0,0,W,H);
  drawSky();
  drawPitch();

  // trail
  for(let i=1;i<trail.length;i++){
    const p=proj(trail[i].x, trail[i].y, trail[i].z);
    const a=(i/trail.length)*0.45;
    cx.fillStyle=`rgba(255,255,255,${a})`;
    cx.beginPath(); cx.arc(p.sx,p.sy,p.r*0.35,0,Math.PI*2); cx.fill();
  }

  drawGoal();
  drawAim();

  if(phase==='flight'||phase==='result') drawKeeper();
  else drawKeeper(); // standing still when keepProg=0

  if(phase==='flight' && ball){
    const p=proj(ball.x, ball.y, ball.z);
    rot += 0.10;
    drawBall(p.sx, p.sy, p.r, rot);
  } else if(phase!=='result'){
    const sc=S();
    drawBall(sc.bx, sc.by, sc.br, rot);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ─── Input helpers ────────────────────────────────────────────────────────────
function evPos(e){
  const r=C.getBoundingClientRect();
  const src=e.touches ? e.touches[0] : e;
  return {x: src.clientX-r.left, y: src.clientY-r.top};
}

function aimFromDrag(ex, ey){
  const sc=S();
  const dx=ex-sc.bx, dy=ey-sc.by;
  // Horizontal aim: left/right drag → left/right of goal
  // Map drag distance to goal width (±1 = post edge)
  aimTX = Math.max(-1.2, Math.min(1.2, dx / ((sc.gr-sc.gl)*0.45)));
  // Vertical aim: upward drag → higher shot
  // Full drag to goal top → max height
  const maxUp = sc.by - sc.gt;
  aimTY = Math.max(0, Math.min(1, (sc.by - ey) / (maxUp * 0.7)));
}

// ─── AIM phase ────────────────────────────────────────────────────────────────
C.addEventListener('mousedown', e=>onDown(evPos(e)));
C.addEventListener('mousemove', e=>onMove(evPos(e)));
C.addEventListener('mouseup',   e=>onUp(evPos(e)));
C.addEventListener('touchstart', e=>{e.preventDefault();onDown(evPos(e));},{passive:false});
C.addEventListener('touchmove',  e=>{e.preventDefault();onMove(evPos(e));},{passive:false});
C.addEventListener('touchend',   e=>{e.preventDefault();onUp(evPos(e));},  {passive:false});

function onDown(p){
  if(phase!=='aim') return;
  const sc=S();
  if(Math.hypot(p.x-sc.bx, p.y-sc.by) < sc.br*4){
    dragging=true; dragSx=p.x; dragSy=p.y; curSx=p.x; curSy=p.y;
  }
}
function onMove(p){
  if(!dragging||phase!=='aim') return;
  curSx=p.x; curSy=p.y;
  aimFromDrag(p.x, p.y);
}
function onUp(p){
  if(!dragging||phase!=='aim') return;
  dragging=false;
  toPhase('power');
}

// ─── POWER phase ──────────────────────────────────────────────────────────────
const holdBtn=document.getElementById('holdBtn');

function startHold(){
  if(holding) return;
  holding=true;
  powerDir=1;
  holdBtn.textContent='RELEASE!';
  holdBtn.style.background='linear-gradient(135deg,#cc2200,#880000)';
  powerIv=setInterval(()=>{
    power+=powerDir*2.2;
    if(power>=100){power=100;powerDir=-1;}
    if(power<=0){power=0;powerDir=1;}
    document.getElementById('powerFill').style.width=power+'%';
    document.getElementById('powerPct').textContent=Math.round(power)+'%';
  },16);
}
function stopHold(){
  if(!holding) return;
  holding=false;
  clearInterval(powerIv); powerIv=null;
  holdBtn.textContent='HOLD FOR POWER';
  holdBtn.style.background='linear-gradient(135deg,#1a6ed8,#0d4aab)';
  toPhase('spin');
}

holdBtn.addEventListener('mousedown', startHold);
holdBtn.addEventListener('mouseup', stopHold);
holdBtn.addEventListener('mouseleave', stopHold);
holdBtn.addEventListener('touchstart', e=>{e.preventDefault();startHold();},{passive:false});
holdBtn.addEventListener('touchend',   e=>{e.preventDefault();stopHold();}, {passive:false});

// ─── SPIN phase ───────────────────────────────────────────────────────────────
function onSpinTap(e){
  const r=SC.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  const sx=src.clientX-r.left, sy=src.clientY-r.top;
  const cx2=SC.width/2, cy2=SC.height/2, sr=SC.width*0.45;
  if(Math.hypot(sx-cx2,sy-cy2)<sr){
    spinX=sx/SC.width; spinY=sy/SC.height;
    spinChosen=true; drawSpinCanvas();
  }
}
SC.addEventListener('mousedown', onSpinTap);
SC.addEventListener('touchstart', e=>{e.preventDefault();onSpinTap(e);},{passive:false});

document.getElementById('shootBtn').addEventListener('click', ()=>{if(phase==='spin') toPhase('flight');});
document.getElementById('shootBtn').addEventListener('touchstart', e=>{e.preventDefault();if(phase==='spin')toPhase('flight');},{passive:false});

// ─── Result: reset ────────────────────────────────────────────────────────────
document.getElementById('result').addEventListener('click', reset);
document.getElementById('result').addEventListener('touchstart', e=>{e.preventDefault();reset();},{passive:false});

// ─── Phase manager ────────────────────────────────────────────────────────────
function hide(...ids){ ids.forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; }); }
function show(id, flex=false){ document.getElementById(id).style.display = flex?'flex':'block'; }

function toPhase(p){
  phase=p;
  hide('msg','powerWrap','holdBtn','spinWrap');
  if(p==='aim'){
    show('msg');
    document.getElementById('msg').textContent='Drag from the ball toward the goal to aim';
  } else if(p==='power'){
    show('msg');
    document.getElementById('msg').textContent='Hold the button — release to lock power';
    show('powerWrap',true);
    show('holdBtn');
  } else if(p==='spin'){
    show('msg');
    document.getElementById('msg').textContent='Tap ball for spin, then shoot';
    show('spinWrap',true);
    spinChosen=false; spinX=0.5; spinY=0.5;
    drawSpinCanvas();
  } else if(p==='flight'){
    initFlight();
    lastStep=0;
  }
}

function reset(){
  power=0; powerDir=1; holding=false; clearInterval(powerIv); powerIv=null;
  spinX=0.5; spinY=0.5; spinChosen=false;
  aimTX=0; aimTY=0.5;
  ball=null; trail=[]; outcome=null;
  keepDir=0; keepProg=0; flightLen=0; stepCount=0;
  dragging=false; rot=0;
  document.getElementById('powerFill').style.width='0%';
  document.getElementById('powerPct').textContent='0%';
  document.getElementById('result').style.display='none';
  toPhase('aim');
}

// ─── Start ────────────────────────────────────────────────────────────────────
toPhase('aim');
</script>
